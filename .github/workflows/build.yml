name: Build GSuite

on:
  push:
    branches:
      - features/wails3
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, for example 0.1.84
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: gsuite-windows-amd64
            output: bin/GSuite-windows-amd64.exe
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            artifact: gsuite-darwin-amd64
            output: bin/GSuite-darwin-amd64.zip
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            artifact: gsuite-linux-amd64
            output: bin/GSuite-linux-amd64.deb

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux WebView dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Wails CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.10
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path (go env GOPATH) 'bin')

      - name: Install Wails CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.10
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync package version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          version="${RAW_VERSION#v}"
          node js/bump-version.js set "$version"

      - name: Install UPX
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:ChocolateyInstall 'bin')

      - name: Build
        shell: bash
        run: wails3 build GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}

      - name: Package macOS app
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          wails3 package GOOS=darwin GOARCH=amd64
          test -d bin/GSuite.app
          ditto -c -k --sequesterRsrc --keepParent bin/GSuite.app bin/GSuite-darwin-amd64.zip
          test "$(zipinfo -1 bin/GSuite-darwin-amd64.zip | awk -F/ 'NF {print $1}' | sort -u | grep -c '^GSuite.app$')" -eq 1

      - name: Package Linux deb
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          GOARCH=amd64 wails3 tool package -name GSuite -format deb -config ./build/linux/nfpm/nfpm.yaml -out ./bin
          shopt -s nullglob
          debs=(bin/*.deb)
          test "${#debs[@]}" -eq 1
          mv "${debs[0]}" bin/GSuite-linux-amd64.deb

      - name: Name Windows executable
        if: matrix.goos == 'windows'
        shell: pwsh
        run: Move-Item -LiteralPath bin\GSuite.exe -Destination bin\GSuite-windows-amd64.exe

      - name: Upload exact release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ matrix.output }}

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/features/wails3'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release version
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$VERSION_INPUT" ]]; then
            version="${VERSION_INPUT#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Linux WebView dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.10
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Normalize release assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets/gsuite-windows-amd64 -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find release-assets/gsuite-darwin-amd64 -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find release-assets/gsuite-linux-amd64 -maxdepth 1 -type f | wc -l)" -eq 1
          mkdir -p release-files
          cp release-assets/gsuite-windows-amd64/GSuite-windows-amd64.exe release-files/
          cp release-assets/gsuite-darwin-amd64/GSuite-darwin-amd64.zip release-files/
          cp release-assets/gsuite-linux-amd64/GSuite-linux-amd64.deb release-files/

      - name: Generate and verify latest.json
        shell: bash
        env:
          WAILS_UPDATER_PRIVATE_KEY: ${{ secrets.WAILS_UPDATER_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          test -n "$WAILS_UPDATER_PRIVATE_KEY"
          key_file="$RUNNER_TEMP/wails-updater.key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$WAILS_UPDATER_PRIVATE_KEY" > "$key_file"
          wails3 updater manifest -version "$version" -channel stable -name "GSuite $version" -key "$key_file" -output latest.json release-files/GSuite-windows-amd64.exe release-files/GSuite-darwin-amd64.zip release-files/GSuite-linux-amd64.deb
          wails3 updater verify -manifest latest.json -publickey wails-updater.key.pub -dir release-files

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          gh release create "v${version}" release-files/GSuite-windows-amd64.exe release-files/GSuite-darwin-amd64.zip release-files/GSuite-linux-amd64.deb latest.json --repo "$GITHUB_REPOSITORY" --title "GSuite v${version}" --generate-notes --target "$GITHUB_SHA"
