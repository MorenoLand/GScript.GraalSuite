name: Build GSuite

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, for example 0.1.84
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: gsuite-windows-x64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            artifact: gsuite-macos-x64
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            artifact: gsuite-linux-x64

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.10
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path (go env GOPATH) 'bin')

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync package version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          version="${RAW_VERSION#v}"
          node js/bump-version.js set "$version"

      - name: Install Linux WebView dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install UPX
        if: matrix.goos == 'windows'
        run: choco install upx -y --no-progress

      - name: Build
        shell: bash
        run: wails3 build GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}

      - name: Package macOS app
        if: matrix.goos == 'darwin'
        shell: bash
        run: wails3 package GOOS=darwin GOARCH=amd64

      - name: Package Linux app
        if: matrix.goos == 'linux'
        shell: bash
        run: wails3 package GOOS=linux GOARCH=amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            bin/GSuite.exe
            bin/GSuite
            bin/GSuite.app
            bin/*.AppImage
            bin/*.deb
            bin/*.rpm
            bin/*.pkg.tar.zst
